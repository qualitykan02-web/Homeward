<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard สถานการณ์ HomeWard จังหวัดกาญจนบุรี</title>
<style>
:root{
  --green:#1FA971; --dgreen:#0E7C5A; --tgreen:#E3F6EC;
  --blue:#3AA8E0; --dblue:#1B7FB5; --tblue:#E3F2FB;
  --pink:#EC4C8A; --dpink:#C2185B; --tpink:#FDE7F0;
  --ink:#1F2D3A; --muted:#5F6B76; --line:#D6E8E0; --bg:#F4FAF8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma","Loma",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(100deg,#12A07A 0%,#2AA4B8 55%,#3AA8E0 100%)}
header.hero .wrap{position:relative;display:flex;align-items:center;gap:20px;min-height:210px;padding-top:22px;padding-bottom:46px}
.logo{flex:none;width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.hero h1{margin:0;font-size:clamp(22px,3.6vw,38px);line-height:1.2;font-weight:700}
.hero p{margin:6px 0 0;font-size:clamp(13px,1.8vw,18px);opacity:.95}
.scene{position:absolute;right:0;bottom:0;height:100%;width:min(46%,520px);pointer-events:none}
.scene svg{height:100%;width:100%}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:44px;width:100%}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
nav.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--pink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;align-items:center;padding-top:8px;padding-bottom:8px}
nav.tabs button{font:inherit;border:0;background:var(--tgreen);color:var(--dgreen);padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s}
nav.tabs button:hover{background:#cfeedd}
nav.tabs button.on{background:linear-gradient(90deg,var(--green),var(--blue));color:#fff;box-shadow:0 2px 8px rgba(31,169,113,.35)}
main{padding:10px 0 40px}
.tab{display:none}
.tab.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.kpi{display:flex;gap:12px;align-items:center;background:var(--tint);border-left:6px solid var(--acc);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi .ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.kpi .ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:800;color:var(--deep);line-height:1.15}
.kpi .sub{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{margin:0 0 12px;font-size:17px;color:var(--dgreen);display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--green),var(--blue))}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--dgreen)}
.sec i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center}
.sec svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donutwrap.col{flex-direction:column}
.donutwrap svg{width:220px;height:220px;flex:none}
.lg{width:100%;font-size:13.5px}
.lg div{display:flex;align-items:center;gap:8px;margin:4px 0}
.lg b.sw{flex:none;width:13px;height:13px;border-radius:3px}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .n{font-weight:800}
.lg .p{color:var(--muted);font-size:12.5px;min-width:46px;text-align:right}
.sl{cursor:pointer;transition:stroke-width .12s}
.sl.hl{stroke-width:38}
.lg div.lr{cursor:pointer;border-radius:6px;padding:2px 4px;margin:2px 0}
.lg div.lr.hl{background:#EEF7F3}
#tip{position:fixed;z-index:60;pointer-events:none;display:none;max-width:320px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--tc,#1FA971);border-radius:10px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13.5px;line-height:1.4}
#tip b{display:block;color:var(--ink)}
#tip span{color:var(--muted)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:linear-gradient(90deg,var(--green),#25A794);color:#fff;font-weight:600;padding:9px 8px;text-align:center;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid #E5F0EB;text-align:center}
td.l,th.l{text-align:left}
tbody tr:nth-child(even){background:#F4FBF8}
tr.tot td{background:var(--tgreen);font-weight:700;color:var(--dgreen)}
td.bar{background-repeat:no-repeat;background-position:left center}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
footer{background:#fff;border-top:3px solid var(--green);padding:14px 0;font-size:12.5px;color:var(--muted)}
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr} .g2{grid-template-columns:1fr}
  .scene{opacity:.28;width:70%} .logo{width:64px;height:64px}
}
.hc{display:inline-block;background:var(--tpink);color:var(--dpink);border-radius:999px;padding:1px 10px;margin:2px 4px 2px 0;font-size:12.5px;line-height:1.5}
.hc b{color:var(--dpink)}
td.hl{text-align:left;min-width:280px}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mini div{background:var(--tint);border-top:4px solid var(--acc);border-radius:10px;padding:10px 8px;text-align:center}
.mini span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.mini b{display:block;font-size:26px;line-height:1.2;color:var(--deep)}
.selbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.selbox label{font-weight:700;color:var(--dgreen)}
.selbox select{flex:1;min-width:260px;font:inherit;font-size:16px;padding:10px 14px;border:2px solid var(--green);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.selbox select:focus{outline:3px solid #cfeedd}
tr[data-h]{cursor:pointer}
tr[data-h]:hover td{background:#FFF6D6}
tr[data-h].cur td{background:#FFEFB5;font-weight:600}
.scroll{max-height:470px;overflow:auto}
.scroll th{position:sticky;top:0}
.donutwrap.wide{flex-wrap:nowrap;justify-content:flex-start;gap:36px;padding:6px 10px}
.donutwrap.wide svg{width:250px;height:250px}
.donutwrap.wide .lg{flex:1;min-width:0;width:auto}
@media (max-width:900px){.mini{grid-template-columns:repeat(3,1fr)} .donutwrap.wide{flex-wrap:wrap;justify-content:center}}
.sp{flex:1}
nav.tabs button.live{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:13px;padding:7px 14px;display:flex;align-items:center;gap:8px}
.live i{width:10px;height:10px;border-radius:50%;background:#9AA7B1;display:inline-block;flex:none}
.live.ok i{background:#1FA971;animation:pulse 2s infinite}
.live.load i{background:#3AA8E0;animation:pulse 1s infinite}
.live.warn i{background:#F5A623}
.live.err i{background:#EC4C8A}
@keyframes pulse{50%{opacity:.3}}
.banner{display:none;margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:14px}
.banner.warn{display:block;background:#FFF6DD;color:#8A5A00;border:1px solid #F3DDA0}
.banner.err{display:block;background:var(--tpink);color:var(--dpink);border:1px solid #f6b9d1}
.banner small{display:block;opacity:.85;margin-top:2px;font-size:12.5px}
@media (max-width:700px){#livetxt{max-width:150px;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>

let donutSeq=0;
function donut(parts,cLab,cVal,cls){
  const id=++donutSeq;
  const total = parts.reduce((a,p)=>a+p.v,0) || 1; const R=78, C=2*Math.PI*R; let off=0, arcs="";
  parts.forEach((p,k)=>{ const len=p.v/total*C;
    if(p.v>0) arcs += `<circle class="sl" data-i="${id}-${k}" data-l="${esc(p.full||p.l)}" data-v="${n(p.v)}" data-p="${pct(p.v,total)}" data-c="${p.c}" cx="105" cy="105" r="${R}" fill="none" stroke="${p.c}" stroke-width="30" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 105 105)"></circle>`;
    off += len; });
  const lg = parts.map((p,k)=>`<div class="lr" data-i="${id}-${k}" data-l="${esc(p.full||p.l)}" data-v="${n(p.v)}" data-p="${pct(p.v,total)}" data-c="${p.c}"><b class="sw" style="background:${p.c}"></b><span class="nm">${esc(p.l)}</span><span class="n">${n(p.v)}</span><span class="p">${pct(p.v,total)}</span></div>`).join("");
  return `<div class="donutwrap ${cls||""}"><svg viewBox="0 0 210 210">${arcs}<text x="105" y="100" text-anchor="middle" font-size="12" fill="#5F6B76">${cLab}</text><text x="105" y="126" text-anchor="middle" font-size="28" font-weight="800" fill="#0E7C5A">${cVal}</text></svg><div class="lg">${lg}</div></div>`;
}

function bld(x,y,w,h,cross){
  let s = `<rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="5" fill="#fff"/>`;
  const cols = Math.max(2,Math.floor(w/26)), rows = Math.max(2,Math.floor((h-30)/30));
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) s += `<rect x="${x+(w/(cols+1))*(c+1)-6}" y="${y-h+14+r*((h-44)/rows)}" width="12" height="15" rx="2" fill="#BEE1F0"/>`;
  s += `<rect x="${x+w/2-10}" y="${y-26}" width="20" height="26" rx="3" fill="#96CDE6"/>`;
  if(cross){ const cx=x+w/2, cy=y-h-6; s+=`<circle cx="${cx}" cy="${cy}" r="19" fill="#fff"/><rect x="${cx-4.5}" y="${cy-12}" width="9" height="24" rx="2" fill="#EC4C8A"/><rect x="${cx-12}" y="${cy-4.5}" width="24" height="9" rx="2" fill="#EC4C8A"/>`; }
  return s;
}
const heartPath = (cx,cy,s) => { let p=[]; for(let a=0;a<=360;a+=6){ const t=a*Math.PI/180; const x=16*Math.pow(Math.sin(t),3); const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); p.push((cx+x*s).toFixed(1)+","+(cy-y*s).toFixed(1)); } return `<polygon points="${p.join(" ")}" fill="#EC4C8A"/>`; };

  if(el) tipShow(el,e.clientX,e.clientY); else tip.style.display = "none";

  REFRESH_SECONDS: 45,            // รอบการดึงข้อมูลซ้ำ (ปรับได้ 30–60 วินาที)
  API_KEY: "",                    // เว้นว่าง = ใช้โหมดปกติ (ไม่ต้องมี key) | ใส่ Google API key = ใช้ Sheets API (เร็ว/เสถียรกว่า และค้นหาแท็บเองอัตโนมัติ)
  HOSPITAL_TAB: "",               // เว้นว่าง = ใช้ “แท็บแรก” ของไฟล์ (ตารางสถานการณ์โรงพยาบาล)
  DISEASE_TAB: "TOP 20 Diagnoses",// แท็บรายการโรครวม
  HOSPITAL_TABS: ["รพ.สังขละบุรี", "รพ.สมเด็จพระสังฆราชองค์ที่ 19", "รพ.ห้วยกระเจาฯ", "รพ.พยาบาลสถานฯ", "รพ.ไทรโยค", "รพ.พหลฯ", "รพ.มะการักษ์", "รพ.บ่อพลอย", "รพ.ท่ากระดาน", "รพ.ด่าน", "รพ.เลาขวัญ", "รพ.ทองผาภูมิ", "รพ.เจ้าคุณฯ", "รพ.ศุกร์ศิริฯ", "รพ.สมเด็จพระปิยฯ", "รพ.หนองปรือ"]         // แท็บโรคแยกรายโรงพยาบาล (ถ้าเพิ่มแท็บใหม่ ให้เพิ่มชื่อที่นี่ | โหมด API ไม่ต้องเพิ่ม)
};
const REFRESH = (()=>{ const q = +new URLSearchParams(location.search).get("refresh");   // ใช้ทดสอบ: ?refresh=10
  return q>=5 ? q : Math.min(60,Math.max(30,CONFIG.REFRESH_SECONDS)); })();

function parseCSV(t){
  t = t.replace(/^﻿/,""); const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
const txt = v => String(v==null?"":v).trim();
const isNum = v => { const s=txt(v).replace(/[,\s]/g,""); return s!=="" && !isNaN(Number(s)); };
const toNum = v => isNum(v) ? Number(txt(v).replace(/[,\s]/g,"")) : 0;

/* อ่านตารางจากตำแหน่งคอลัมน์ (ไม่พึ่งชื่อหัวตาราง จึงไม่พังเมื่อ Google เดาชนิดข้อมูลผิด) */
function parseHospitals(g){
  const rows=[]; let asof="";
  for(const c of g){
    for(const cell of c){ const s=txt(cell); if(s.startsWith("หมายเหตุ")) asof = s.replace("หมายเหตุ","").trim(); }
    if(isNum(c[0]) && txt(c[1]) && !isNum(c[1]) && isNum(c[4]))
      rows.push([toNum(c[0]),txt(c[1]),txt(c[2]),txt(c[3]),toNum(c[4]),toNum(c[5]),toNum(c[6]),toNum(c[7]),toNum(c[8]),toNum(c[9])]);
  }
  return {rows,asof};
}
function parseDiseases(g){
  const out=[];
  for(const c of g){ const code=txt(c[0]), nm=txt(c[1]); if(code && nm && !isNum(code) && isNum(c[2])) out.push([code,nm,toNum(c[2])]); }
  return out;
}
function hospFromTitle(g,known){           // คืนชื่อโรงพยาบาล | "" = แท็บว่าง | null = ชื่อไม่ตรงกับตารางโรงพยาบาล
  for(const c of g.slice(0,4)){ const t=txt(c[0]); if(!t) continue;
    const full=t.replace(/^รพ\./,"โรงพยาบาล"); if(known.has(full)) return full;
    for(const k of known) if(k.replace("โรงพยาบาล","รพ.")===t) return k;
    return null; }
  return "";
}
function assemble(hospGrid,diseaseGrids,tabs){   // tabs = [{tab, grid|null(อ่านไม่ได้)}]
  const H = parseHospitals(hospGrid);
  if(!H.rows.length) throw new Error("อ่านตารางสถานการณ์โรงพยาบาลไม่ได้ (แท็บแรกของไฟล์ต้องเป็นตารางโรงพยาบาล)");
  let diag=[]; for(const g of diseaseGrids){ diag=parseDiseases(g); if(diag.length) break; }
  if(!diag.length) throw new Error("อ่านแท็บรายการโรค “"+CONFIG.DISEASE_TAB+"” ไม่ได้ (ตรวจชื่อแท็บ)");
  const known = new Set(H.rows.map(r=>r[1])), dh=[], warn=[];
  tabs.forEach(({tab,grid})=>{
    if(!grid){ warn.push(tab); return; }
    const full = hospFromTitle(grid,known);
    if(full===null){ warn.push(tab); return; }
    if(full==="") return;
    parseDiseases(grid).forEach(x=>dh.push([full,x[0],x[1],x[2]]));
  });
  return {hosp:H.rows, diag, dh, asof:H.asof, warn};
}

/* โหมดปกติ: Google Visualization (gviz) — ไม่ต้องมี API key */
async function gvizGrid(tab){
  const u = new URL(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`);
  u.searchParams.set("tqx","out:csv"); u.searchParams.set("headers","0");
  if(tab) u.searchParams.set("sheet",tab);
  const r = await fetch(u,{cache:"no-store"}); const t = await r.text();
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(/^\s*</.test(t) || /setResponse\(/.test(t)) throw new Error("เข้าถึงไฟล์ไม่ได้ — ตรวจสอบว่าแชร์เป็น “ทุกคนที่มีลิงก์ เป็นผู้ดู”");
  return parseCSV(t);
}
async function loadGviz(){
  const hg = await gvizGrid(CONFIG.HOSPITAL_TAB||"");
  const dn = CONFIG.DISEASE_TAB.trim(), dg=[];
  for(const nm of [dn+" ",dn]){ try{ dg.push(await gvizGrid(nm)); break; }catch(e){ /* ลองชื่อถัดไป */ } }
  const res = await Promise.allSettled(CONFIG.HOSPITAL_TABS.map(t=>gvizGrid(t)));
  return assemble(hg,dg,CONFIG.HOSPITAL_TABS.map((tab,i)=>({tab,grid:res[i].status==="fulfilled"?res[i].value:null})));
}

/* โหมด API: ใส่ API_KEY ใน CONFIG (เรียกครั้งเดียวได้ทุกแท็บ และค้นหาแท็บเอง) */
async function loadApi(){
  const base=`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}`, key=encodeURIComponent(CONFIG.API_KEY);
  const j = async u => { const r=await fetch(u,{cache:"no-store"}); const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((d.error&&d.error.message)||("HTTP "+r.status)); return d; };
  const titles = (await j(`${base}?fields=sheets.properties.title&key=${key}`)).sheets.map(s=>s.properties.title);
  const q = titles.map(t=>"ranges="+encodeURIComponent(`'${t.replace(/'/g,"''")}'!A1:J500`)).join("&");
  const vr = (await j(`${base}/values:batchGet?majorDimension=ROWS&${q}&key=${key}`)).valueRanges;
  const grid = t => vr[titles.indexOf(t)].values || [];
  const hosp = CONFIG.HOSPITAL_TAB || titles[0];
  const want = CONFIG.DISEASE_TAB.trim().toLowerCase();
  const dis = titles.find(t=>t.trim().toLowerCase()===want) || titles.find(t=>/^top/i.test(t.trim()));
  return assemble(grid(hosp), dis?[grid(dis)]:[], titles.filter(t=>t!==hosp && t!==dis).map(tab=>({tab,grid:grid(tab)})));
}

/* ===== สถานะ + รอบการดึงข้อมูล ===== */
const liveEl = document.getElementById("live"), liveTx = document.getElementById("livetxt"), bannerEl = document.getElementById("banner");
function setLive(state,time,warn,err){
  liveEl.className = "live "+state; liveEl.title = `ดึงข้อมูลใหม่ทุก ${REFRESH} วินาที • คลิกเพื่อดึงทันที`;
  liveTx.textContent = state==="load" ? "กำลังอัปเดต…" : state==="ok" ? "Refresh • อัปเดตล่าสุด "+time : state==="warn" ? "Refresh (บางแท็บอ่านไม่ได้) • "+time
    : state==="err" ? "เชื่อมต่อไม่ได้ • ใช้ข้อมูลล่าสุดที่มี" : state==="off" ? "ข้อมูลที่ฝังในไฟล์" : "กำลังเชื่อมต่อ…";
  if(state==="err"){ bannerEl.className="banner err"; bannerEl.innerHTML = `ดึงข้อมูลจาก Google Sheets ไม่สำเร็จ — กำลังแสดงข้อมูลล่าสุดที่มี (${esc(ASOF)}) และจะลองใหม่ทุก ${REFRESH} วินาที<small>${esc(err||"")}</small>`; }
  else if(state==="warn"){ bannerEl.className="banner warn"; bannerEl.innerHTML = `อ่านโรคแยกรายโรงพยาบาลจากบางแท็บไม่ได้ (ตรวจชื่อแท็บในไฟล์ Google Sheets หรือใน CONFIG.HOSPITAL_TABS)<small>${warn.map(esc).join(" • ")}</small>`; }
  else if(state!=="load"){ bannerEl.className="banner"; bannerEl.innerHTML=""; }
}
let lastHash = JSON.stringify([SNAPSHOT.hosp,SNAPSHOT.diag,SNAPSHOT.dh,ASOF]), busy=false, timer=null;
function schedule(){ clearTimeout(timer); timer=setTimeout(()=>{ document.hidden ? schedule() : tick(); }, REFRESH*1000); }
async function tick(){
  if(busy) return; busy=true; setLive("load");
  try{
    const D = await (CONFIG.API_KEY ? loadApi() : loadGviz());
    const d = new Date(), time = d.toLocaleTimeString("th-TH",{hour12:false});
    D.asof = D.asof || ("ข้อมูลจาก Google Sheets • ดึงเมื่อ "+d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}));
    const h = JSON.stringify([D.hosp,D.diag,D.dh,D.asof]);
    if(h!==lastHash){ lastHash=h; ASOF=D.asof; render(D); }      // วาดใหม่เฉพาะเมื่อข้อมูลเปลี่ยน (ไม่กระพริบ ไม่เสียตำแหน่งที่เลือก)
    setLive(D.warn.length?"warn":"ok",time,D.warn);
  }catch(e){ setLive("err",null,[],(e&&e.message)||String(e)); }
  finally{ busy=false; schedule(); }
}
function startLive(){
  if(!CONFIG.SHEET_ID){ setLive("off"); return; }
  liveEl.addEventListener("click",()=>tick());
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });   // กลับมาเปิดหน้านี้ → ดึงทันที
  tick();
}


render(SNAPSHOT); show("ov"); startLive();
</script>
